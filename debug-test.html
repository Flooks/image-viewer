<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Test</h1>
    <div id="test-output"></div>
    
    <script type="module">
        console.log('Script loading...');
        console.log('Document ready state:', document.readyState);
        
        // Try to import from app.js
        import { initializeApplication } from './app.js';
        
        console.log('Import successful');
        console.log('initializeApplication:', typeof initializeApplication);
        
        // Try to call it
        try {
            initializeApplication();
            document.getElementById('test-output').textContent = 'Initialization called successfully!';
        } catch (error) {
            console.error('Error calling initializeApplication:', error);
            document.getElementById('test-output').textContent = 'Error: ' + error.message;
        }
    </script>
</body>
</html>
