<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reddit Authorization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1b;
      color: #d7dadc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #343536;
      border-top-color: #ff4500;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    p {
      color: #818384;
      font-size: 0.9rem;
    }
    .success {
      color: #46d160;
    }
    .error {
      color: #ff4500;
    }
    .error-details {
      margin-top: 15px;
      padding: 15px;
      background: #272729;
      border-radius: 8px;
      text-align: left;
      font-size: 0.85rem;
    }
    .error-details code {
      color: #ff4500;
      word-break: break-all;
    }
    .close-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff4500;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    .close-btn:hover {
      background: #ff5722;
    }
  </style>
</head>
<body>
  <div class="container" id="content">
    <div class="spinner"></div>
    <h1>Completing authorization...</h1>
    <p>Please wait while we complete your Reddit login.</p>
  </div>

  <script>
    (function() {
      const container = document.getElementById('content');
      
      function showSuccess() {
        container.innerHTML = `
          <h1 class="success">✓ Authorization successful!</h1>
          <p>You can close this window now.</p>
          <button class="close-btn" onclick="window.close()">Close Window</button>
        `;
        
        // Auto-close after 2 seconds
        setTimeout(() => {
          window.close();
        }, 2000);
      }
      
      function showError(message, details) {
        container.innerHTML = `
          <h1 class="error">Authorization failed</h1>
          <p>${message}</p>
          ${details ? `<div class="error-details"><code>${details}</code></div>` : ''}
          <button class="close-btn" onclick="window.close()">Close Window</button>
        `;
      }
      
      // Get the hash fragment (contains the token)
      const hash = window.location.hash;
      
      if (!hash || hash.length < 2) {
        // No hash - check for error in query string
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        if (error) {
          showError(
            error === 'access_denied' ? 'You denied the authorization request.' : `Error: ${error}`,
            params.get('error_description')
          );
        } else {
          showError('No authorization data received.', 'Missing hash fragment in callback URL');
        }
        return;
      }
      
      // Parse the hash to verify it contains a token
      const hashParams = new URLSearchParams(hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const error = hashParams.get('error');
      
      if (error) {
        showError(
          error === 'access_denied' ? 'You denied the authorization request.' : `Error: ${error}`,
          hashParams.get('error_description')
        );
        return;
      }
      
      if (!accessToken) {
        showError('No access token received.', hash);
        return;
      }
      
      // Check CSRF state if we stored one
      const storedState = sessionStorage.getItem('oauth_state');
      const returnedState = hashParams.get('state');
      if (storedState && returnedState && storedState !== returnedState) {
        showError('State mismatch - possible CSRF attack.', `Expected: ${storedState}, Got: ${returnedState}`);
        return;
      }
      
      // Try to send the token to the opener window
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'oauth_callback',
            fragment: hash
          }, window.location.origin);
          showSuccess();
        } catch (e) {
          // If postMessage fails, store in localStorage as fallback
          try {
            localStorage.setItem('oauth_pending_callback', hash);
            showSuccess();
          } catch (e2) {
            showError('Failed to complete authorization.', e2.message);
          }
        }
      } else {
        // No opener - store in localStorage for the main page to pick up
        try {
          localStorage.setItem('oauth_pending_callback', hash);
          showSuccess();
        } catch (e) {
          showError('Failed to store authorization.', e.message);
        }
      }
    })();
  </script>
</body>
</html>
